name: Release

# Pushing a v* tag tests the commit, builds every platform and publishes the
# binaries on a GitHub release.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go test -count=1 ./...
      - name: Build
        env:
          TAG: ${{ github.ref_name }}
        run: |
          mkdir dist
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64 windows/arm64; do
            os=${target%/*}
            arch=${target#*/}
            name="touchdown_${TAG}_${os}_${arch}"
            dir="build/$name"
            mkdir -p "$dir"
            binary=touchdown
            if [ "$os" = windows ]; then binary=touchdown.exe; fi
            CGO_ENABLED=0 GOOS=$os GOARCH=$arch go build -trimpath -ldflags "-s -w -X main.version=$TAG" -o "$dir/$binary" .
            cp README.md LICENSE "$dir/"
            if [ "$os" = windows ]; then
              (cd "$dir" && zip -qr "../../dist/$name.zip" .)
            else
              tar -C "$dir" -czf "dist/$name.tar.gz" .
            fi
          done
          (cd dist && sha256sum * > SHA256SUMS)
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" dist/* --verify-tag --generate-notes --title "$TAG"
